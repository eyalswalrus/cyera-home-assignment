[project]
name = "identityhub-digest"
version = "0.1.0"
description = "NHI Blog Digest: summarize the latest Oasis Security blog post and file it in Jira via IdentityHub"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "trafilatura>=2.0",
    "pydantic-settings>=2.6",
]

[project.scripts]
digest = "digest.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["digest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
