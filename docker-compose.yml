name: identityhub

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Used by the blog digest when the optional `ollama` service below is running.
      OLLAMA_URL: http://ollama:11434
    volumes:
      - identityhub-data:/data
    restart: unless-stopped

  # Optional free local LLM for the NHI Blog Digest summaries:
  #   docker compose --profile llm up -d           (app + model)
  #   docker compose --profile llm up -d ollama    (just the model, for a locally run server)
  # Downloads the model (~2 GB for llama3.2:3b) on first start. Without it, the digest uses Claude
  # (if ANTHROPIC_API_KEY is set) or a built-in extractive summary.
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    # Localhost only, so a server run outside Docker (uv run uvicorn ...) can use the model too.
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint:
      - /bin/sh
      - -c
      - ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull "$$OLLAMA_MODEL"; wait
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  identityhub-data:
  ollama-models:
