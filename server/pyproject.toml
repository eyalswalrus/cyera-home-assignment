[project]
name = "identityhub"
version = "0.1.0"
description = "IdentityHub - report Non-Human Identity findings to Jira"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "fastapi-users[sqlalchemy]>=14.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "atlassian-python-api>=4.0",
    "starlette-csrf>=3.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "responses>=0.25",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
