[project]
name = "identityhub"
version = "0.1.0"
description = "IdentityHub - report Non-Human Identity findings to Jira"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "fastapi-users[sqlalchemy]>=14.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "atlassian-python-api>=5.0",  # JiraCloud client (enhanced JQL search)
    "starlette-csrf>=3.0",
    "secure>=2.0.1",
    "limits>=5.8.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "responses>=0.25",
    "respx>=0.23.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Authlib 1.8 prefers the new `httpx2` client and warns when falling back to `httpx`, which it
    # still supports. We stay on httpx for now (respx mocks it); see DESIGN.md.
    "ignore:The httpx module is deprecated:authlib.deprecate.AuthlibDeprecationWarning",
]
